version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    volumes:
      - cockpit-data:/app/data
    environment:
      - API_PORT=4000
      - DOCKER_HOST=${DOCKER_HOST:-tcp://host.docker.internal:2375}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  cockpit-data:
