services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    volumes:
      - cockpit-data:/app/data
    environment:
      - API_PORT=4000
      - DOCKER_HOST=${DOCKER_HOST:-tcp://host.docker.internal:2375}
      - COCKPIT_USER=${COCKPIT_USER:-admin}
      - COCKPIT_PASS=${COCKPIT_PASS:-cockpit}
      - SESSION_SECRET=${SESSION_SECRET:-change-me}
    env_file:
      - .env
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  cockpit-data:
