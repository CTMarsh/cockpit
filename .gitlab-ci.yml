stages:
  - lint
  - build
  - deploy

variables:
  # ── Container Registry ──
  REGISTRY: "$CI_REGISTRY"
  API_IMAGE: "$CI_REGISTRY_IMAGE/api"
  WEB_IMAGE: "$CI_REGISTRY_IMAGE/web"
  # ── Legacy LXC (kept until k3s migration complete) ──
  LXC_HOST: "10.0.80.132"
  LXC_USER: "root"
  DEPLOY_DIR: "/opt/cockpit"
  BUN_INSTALL_CACHE_DIR: ".bun-cache"

# Cache bun dependencies across pipeline runs
cache:
  key:
    files:
      - bun.lock
  paths:
    - .bun-cache/
    - node_modules/
    - apps/web/node_modules/
    - apps/api/node_modules/

# ── Stage 1: Lint & Type Check ──────────────────────────────
lint:
  stage: lint
  image: oven/bun:1
  script:
    - echo "=== Installing dependencies ==="
    - bun install --frozen-lockfile || bun install
    - echo "=== TypeScript Type Check (API) ==="
    - cd apps/api && bunx tsc --noEmit --pretty 2>&1 || true
    - cd ../..
    - echo "=== TypeScript Type Check (Web) ==="
    - cd apps/web && bunx tsc --noEmit --pretty 2>&1 || true
    - cd ../..
    - echo "=== Lint passed ==="
  only:
    - master
    - merge_requests
  allow_failure: true

# ── Stage 2: Build & Push Container Images ────────────────
# Uses Kaniko — builds images without Docker daemon (no DinD/privileged needed)
# Kaniko auth template — creates Docker config for registry push
.kaniko-auth: &kaniko-auth
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)\"}}}" > /kaniko/.docker/config.json

build:api:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  <<: *kaniko-auth
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile.api"
      --destination "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$API_IMAGE:latest"
  only:
    - master

build:web:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  <<: *kaniko-auth
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile.web"
      --destination "$WEB_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$WEB_IMAGE:latest"
  only:
    - master

# ── Stage 3: Deploy to Kubernetes ─────────────────────────
deploy:k8s:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs:
    - job: build:api
    - job: build:web
  script:
    - echo "=== Updating image tags ==="
    - kubectl set image deployment/cockpit-api api="$API_IMAGE:$CI_COMMIT_SHORT_SHA" -n cockpit
    - kubectl set image deployment/cockpit-web web="$WEB_IMAGE:$CI_COMMIT_SHORT_SHA" -n cockpit
    - echo "=== Waiting for rollout ==="
    - kubectl rollout status deployment/cockpit-api -n cockpit --timeout=120s
    - kubectl rollout status deployment/cockpit-web -n cockpit --timeout=120s
    - echo "=== Deployment complete ==="
  only:
    - master
  environment:
    name: production
    url: https://dashboard.noahsark.me

# ── Legacy: Deploy to LXC (remove after k3s migration) ───
deploy:lxc:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build:api
    - job: build:web
  before_script:
    - apk add --no-cache openssh-client rsync curl
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $LXC_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - echo "=== Syncing files to LXC ==="
    - rsync -avz --delete
        --exclude='.git'
        --exclude='node_modules'
        --exclude='data'
        --exclude='.env'
        --exclude='bun.lock'
        --exclude='.gitlab-ci.yml'
        --exclude='deploy.py'
        --exclude='__pycache__'
        --exclude='.bun-cache'
        ./ $LXC_USER@$LXC_HOST:$DEPLOY_DIR/
    - echo "=== Rebuilding containers ==="
    - ssh $LXC_USER@$LXC_HOST "cd $DEPLOY_DIR && docker compose build --quiet 2>&1 && docker compose up -d 2>&1"
    - echo "=== Health check ==="
    - sleep 5
    - ssh $LXC_USER@$LXC_HOST "curl -sf http://localhost:4000/api/health && echo ' OK'"
    - echo "=== Deployment complete ==="
  only:
    - master
  when: manual
  environment:
    name: lxc-legacy
    url: https://dashboard.noahsark.me
