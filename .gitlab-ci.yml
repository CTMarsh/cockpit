# ── Workflow: prevent duplicate pipelines ──────────────────
# MR pipelines take priority; branch pipelines only run when no MR exists
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ── Security Scanning Templates ───────────────────────────
# GitLab CI templates for automated security analysis (#106)
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - lint
  - test
  - version
  - build
  - build:ios
  - deploy

variables:
  # ── Container Registry ──
  REGISTRY: "$CI_REGISTRY"
  API_IMAGE: "$CI_REGISTRY_IMAGE/api"
  WEB_IMAGE: "$CI_REGISTRY_IMAGE/web"
  BUN_INSTALL_CACHE_DIR: ".bun-cache"
  # ── SAST Performance ──
  SAST_EXCLUDED_PATHS: "node_modules, .bun-cache, ios, build, dist, vendor, apps/web/node_modules"

# Cache bun dependencies across pipeline runs
cache:
  key:
    files:
      - bun.lock
  paths:
    - .bun-cache/
    - node_modules/
    - apps/web/node_modules/
    - apps/api/node_modules/

# ── Stage 1: Lint & Type Check ──────────────────────────────
lint:
  stage: lint
  image: oven/bun:1
  needs: []
  interruptible: true
  script:
    - echo "=== Installing dependencies ==="
    - bun install --frozen-lockfile
    - echo "=== TypeScript Type Check (API) ==="
    - cd apps/api && bunx tsc --noEmit --pretty
    - cd ../..
    - echo "=== TypeScript Type Check (Web) ==="
    - cd apps/web && bunx tsc --noEmit --pretty
    - cd ../..
    - echo "=== Lint passed ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_IID

# ── Stage 2: Tests ────────────────────────────────────────
test:
  stage: test
  image: oven/bun:1
  needs: []
  interruptible: true
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun-cache/
      - node_modules/
      - apps/web/node_modules/
      - apps/api/node_modules/
    policy: pull
  variables:
    COCKPIT_USER: testadmin
    COCKPIT_PASS: testpass123
    SESSION_SECRET: ci-test-secret
  script:
    - bun install --frozen-lockfile
    - echo "=== Starting API server in background ==="
    - bun run apps/api/src/index.ts &
    - |
      # Wait for API to be ready (up to 120s for Bun JIT compilation)
      for i in $(seq 1 60); do
        if curl -sf http://localhost:4000/api/health > /dev/null 2>&1; then
          echo "API ready after ~$((i*2))s"
          break
        fi
        sleep 2
      done
    - echo "=== Running API tests ==="
    - bun test apps/api/src/
    - echo "=== Tests passed ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_MERGE_REQUEST_IID

# ── Stage 3: Auto-Version Bump ─────────────────────────────
# Reads latest git tag, bumps patch (v2.1.1 → v2.1.2), pushes new tag.
# For major/minor bumps, create the tag manually (e.g. v2.2.0).
version:
  stage: version
  image: alpine:3.19
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: fetch
  before_script:
    - apk add --no-cache git
  script:
    - |
      # Get latest tag, default to v0.0.0 if none exist
      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
      echo "Latest tag: $LATEST_TAG"

      # Strip 'v' prefix, split into major.minor.patch
      VERSION="${LATEST_TAG#v}"
      MAJOR=$(echo "$VERSION" | cut -d. -f1)
      MINOR=$(echo "$VERSION" | cut -d. -f2)
      PATCH=$(echo "$VERSION" | cut -d. -f3)

      # Bump patch
      NEW_PATCH=$((PATCH + 1))
      NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
      echo "Bumping: $LATEST_TAG → $NEW_VERSION"

      # Create and push tag
      git config user.email "ci@noahsark.me"
      git config user.name "Cockpit CI"
      git tag -a "$NEW_VERSION" -m "Auto-version: $NEW_VERSION"
      git remote set-url origin "https://cockpit-bot:${BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "$NEW_VERSION"

      # Export for downstream jobs (strip 'v' prefix — UI adds its own)
      echo "APP_VERSION=${NEW_VERSION#v}" > version.env
      echo "Version $NEW_VERSION tagged and pushed"
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_TAG == null

# ── Stage 4: Build & Push Container Images ─────────────────
# Uses Kaniko — builds images without Docker daemon (no DinD/privileged needed)
# Kaniko auth template — creates Docker config for registry push
.kaniko-auth: &kaniko-auth
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)\"}}}" > /kaniko/.docker/config.json

build:api:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  <<: *kaniko-auth
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile.api"
      --destination "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$API_IMAGE:latest"
      --cache=true
      --cache-repo="$CI_REGISTRY_IMAGE/cache/api"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

build:web:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  <<: *kaniko-auth
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  needs:
    - job: version
      artifacts: true
  script:
    - echo "Building web with version $APP_VERSION"
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile.web"
      --destination "$WEB_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$WEB_IMAGE:latest"
      --build-arg "APP_VERSION=$APP_VERSION"
      --cache=true
      --cache-repo="$CI_REGISTRY_IMAGE/cache/web"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ── Stage 5: Deploy to Kubernetes ─────────────────────────
# NOTE: This stage uses `origin` (not `gitlab`) because GitLab CI clones the
# repo with `origin` as the default remote name. In local dev we use `gitlab`
# as our remote, but CI runners always set origin to the project URL.
deploy:k8s:
  stage: deploy
  image:
    name: alpine/k8s:1.35.2
    entrypoint: [""]
  needs:
    - job: version
      artifacts: true
    - job: build:api
    - job: build:web
  resource_group: production
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - echo "=== Updating image tags ==="
    - kubectl set image deployment/cockpit-api api="$API_IMAGE:$CI_COMMIT_SHORT_SHA" -n cockpit
    - kubectl set image deployment/cockpit-web web="$WEB_IMAGE:$CI_COMMIT_SHORT_SHA" -n cockpit
    - echo "=== Setting APP_VERSION=$APP_VERSION on API deployment ==="
    - kubectl set env deployment/cockpit-api APP_VERSION="$APP_VERSION" -n cockpit
    - echo "=== Waiting for rollout ==="
    - kubectl rollout status deployment/cockpit-api -n cockpit --timeout=600s
    - kubectl rollout status deployment/cockpit-web -n cockpit --timeout=600s
    - echo "=== Deployment complete ==="
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment:
    name: production
    url: https://dashboard.noahsark.me

# ── iOS change detection ─────────────────────────────────
.ios-changes: &ios-changes
  changes:
    - ios/CockpitApp/**/*
    - ios/CockpitWatch/**/*
    - ios/CockpitWidgetExtension/**/*
    - ios/project.yml
    - ios/fastlane/**/*
    - ios/Gemfile*

# ── iOS Version (reads from project.yml) ─────────────────
# Separate version track — project.yml MARKETING_VERSION is the source of truth.
# Web auto-bumps patch on every push; iOS version is bumped in project.yml
# when iOS code changes (new modules, features, fixes).
ios:version:
  stage: version
  image: alpine:3.19
  needs: []
  script:
    - |
      IOS_VERSION=$(grep 'MARKETING_VERSION:' ios/project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
      echo "iOS MARKETING_VERSION: $IOS_VERSION"
      echo "IOS_APP_VERSION=$IOS_VERSION" > ios_version.env
  artifacts:
    reports:
      dotenv: ios_version.env
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      <<: *ios-changes
    - if: $CI_MERGE_REQUEST_IID
      <<: *ios-changes

# ── iOS: macOS runner shared config ──────────────────────
.ios-base: &ios-base
  tags:
    - macos
    - ios
  variables:
    LANG: en_US.UTF-8
    LC_ALL: en_US.UTF-8
  before_script:
    - eval "$(/opt/homebrew/bin/brew shellenv)"
    - export PATH="/opt/homebrew/opt/ruby/bin:$HOME/bin:$PATH"
    - |
      # Create and unlock CI keychain to avoid login keychain prompts
      security create-keychain -p "" fastlane_ci.keychain 2>/dev/null || true
      security unlock-keychain -p "" fastlane_ci.keychain
      security set-keychain-settings -t 3600 fastlane_ci.keychain
      security list-keychains -d user -s fastlane_ci.keychain login.keychain-db

# ── Stage: build:ios ─────────────────────────────────────
build:ios:verify:
  stage: build:ios
  <<: *ios-base
  interruptible: true
  script:
    - cd ios
    - xcodegen generate
    - xcodebuild build
      -project CockpitApp.xcodeproj
      -scheme CockpitApp
      -configuration Debug
      -destination 'generic/platform=iOS'
      CODE_SIGNING_ALLOWED=NO
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *ios-changes

build:ios:release:
  stage: build:ios
  <<: *ios-base
  interruptible: true
  needs:
    - job: ios:version
      artifacts: true
  script:
    - cd ios
    - bundle config set --local path 'vendor/bundle'
    - bundle install
    - xcodegen generate
    - echo "Building iOS app with version $IOS_APP_VERSION"
    - bundle exec fastlane build version:"$IOS_APP_VERSION"
  artifacts:
    paths:
      - ios/build/*.ipa
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      <<: *ios-changes

# ── Stage: deploy (iOS) ─────────────────────────────────
deploy:testflight:
  stage: deploy
  <<: *ios-base
  needs:
    - job: ios:version
      artifacts: true
    - job: build:ios:release
      artifacts: true
  resource_group: testflight
  script:
    - cd ios
    - bundle config set --local path 'vendor/bundle'
    - bundle install
    - echo "Deploying iOS $IOS_APP_VERSION to TestFlight"
    - bundle exec fastlane beta
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      <<: *ios-changes
  environment:
    name: testflight

# ── iOS Notifications ────────────────────────────────────
notify:ios:success:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: build:ios:verify
      optional: true
    - job: deploy:testflight
      optional: true
  script:
    - |
      if [ "$CI_MERGE_REQUEST_IID" ]; then
        MSG="MR compile check passed for $CI_COMMIT_SHORT_SHA"
      else
        MSG="$CI_COMMIT_SHORT_SHA uploaded to TestFlight"
      fi
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"✅ Cockpit iOS\", \"body\": \"$MSG\", \"priority\": \"low\"}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *ios-changes
    - if: $CI_COMMIT_BRANCH == "master"
      <<: *ios-changes
  when: on_success
  allow_failure: true

notify:ios:failure:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: build:ios:verify
      optional: true
    - job: deploy:testflight
      optional: true
  script:
    - |
      if [ "$CI_MERGE_REQUEST_IID" ]; then
        MSG="MR compile check failed for $CI_COMMIT_SHORT_SHA"
      else
        MSG="Pipeline $CI_PIPELINE_ID failed for $CI_COMMIT_SHORT_SHA"
      fi
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"❌ Cockpit iOS\", \"body\": \"$MSG\", \"priority\": \"high\"}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_MERGE_REQUEST_IID
      <<: *ios-changes
    - if: $CI_COMMIT_BRANCH == "master"
      <<: *ios-changes
  when: on_failure
  allow_failure: true

# ── Push Notification on Deploy ───────────────────────────
# Sends a push notification via the notify service after deployment
notify:success:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: deploy:k8s
  script:
    - |
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"✅ Cockpit Deployed\", \"body\": \"$CI_COMMIT_SHORT_SHA deployed to production\", \"priority\": \"low\", \"data\": {\"url\": \"$CI_PIPELINE_URL\"}}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  when: on_success
  allow_failure: true

notify:failure:
  stage: deploy
  image: curlimages/curl:8.12.1
  needs:
    - job: deploy:k8s
  script:
    - |
      curl -sf -X POST "https://notify.noahsark.me/api/webhook/${NOTIFY_PROJECT_SLUG}" \
        -H "Content-Type: application/json" \
        -H "X-API-Key: $NOTIFY_API_KEY" \
        -d "{\"title\": \"❌ Cockpit Deploy Failed\", \"body\": \"Pipeline $CI_PIPELINE_ID failed on $CI_COMMIT_SHORT_SHA\", \"priority\": \"high\", \"data\": {\"url\": \"$CI_PIPELINE_URL\"}}" \
      || echo "Notify service unreachable — skipping notification"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  when: on_failure
  allow_failure: true
