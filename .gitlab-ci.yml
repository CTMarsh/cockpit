stages:
  - lint
  - build
  - deploy

variables:
  LXC_HOST: "10.0.80.132"
  LXC_USER: "root"
  DEPLOY_DIR: "/opt/cockpit"
  BUN_INSTALL_CACHE_DIR: ".bun-cache"

# Cache bun dependencies across pipeline runs
cache:
  key:
    files:
      - bun.lock
  paths:
    - .bun-cache/
    - node_modules/
    - apps/web/node_modules/
    - apps/api/node_modules/

# ── Stage 1: Lint & Type Check ──────────────────────────────
lint:
  stage: lint
  image: oven/bun:1
  script:
    - echo "=== Installing dependencies ==="
    - bun install --frozen-lockfile || bun install
    - echo "=== TypeScript Type Check (API) ==="
    - cd apps/api && bunx tsc --noEmit --pretty 2>&1 || true
    - cd ../..
    - echo "=== TypeScript Type Check (Web) ==="
    - cd apps/web && bunx tsc --noEmit --pretty 2>&1 || true
    - cd ../..
    - echo "=== Lint passed ==="
  only:
    - master
    - merge_requests
  allow_failure: true

# ── Stage 2: Build Frontend ─────────────────────────────────
build:web:
  stage: build
  image: oven/bun:1
  script:
    - echo "=== Installing dependencies ==="
    - bun install --frozen-lockfile || bun install
    - echo "=== Building frontend ==="
    - cd apps/web && bun run build
    - echo "=== Build complete ==="
    - ls -la dist/
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 hour
  only:
    - master

# ── Stage 3: Deploy to Production ───────────────────────────
deploy:production:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build:web
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync curl
    - mkdir -p ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $LXC_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - echo "=== Syncing files to LXC ==="
    - rsync -avz --delete
        --exclude='.git'
        --exclude='node_modules'
        --exclude='data'
        --exclude='.env'
        --exclude='bun.lock'
        --exclude='.gitlab-ci.yml'
        --exclude='deploy.py'
        --exclude='__pycache__'
        --exclude='.bun-cache'
        ./ $LXC_USER@$LXC_HOST:$DEPLOY_DIR/
    - echo "=== Rebuilding containers ==="
    - ssh $LXC_USER@$LXC_HOST "cd $DEPLOY_DIR && docker compose build --quiet 2>&1 && docker compose up -d 2>&1"
    - echo "=== Health check ==="
    - sleep 5
    - ssh $LXC_USER@$LXC_HOST "curl -sf http://localhost:4000/api/health && echo ' OK'"
    - echo "=== Deployment complete ==="
  only:
    - master
  environment:
    name: production
    url: https://dashboard.noahsark.me
