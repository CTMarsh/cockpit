name: CockpitApp
# Generated by XcodeGen — https://github.com/yonaskolb/XcodeGen
options:
  bundleIdPrefix: com.ctmarsh
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

schemes:
  CockpitApp:
    build:
      targets:
        CockpitApp: all
        CockpitWidgetExtension: all
        CockpitWatch: all
    run:
      config: Debug
    archive:
      config: Release

settings:
  base:
    DEVELOPMENT_TEAM: WTPX4TSW4N
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  CockpitApp:
    type: application
    platform: iOS
    sources:
      - CockpitApp/Sources
      - path: CockpitApp/Resources/Assets.xcassets
        buildPhase: resources
      - path: CockpitApp/Resources/CockpitApp.entitlements
        buildPhase: none
      - path: CockpitApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: NoahsArk Cockpit
        PRODUCT_BUNDLE_IDENTIFIER: com.ctmarsh.noahsark-cockpit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NoahsArk Cockpit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification fetch"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Cockpit uses Face ID for quick login"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CockpitApp/Resources/CockpitApp.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
    entitlements:
      path: CockpitApp/Resources/CockpitApp.entitlements
      properties:
        aps-environment: production
    dependencies:
      - target: CockpitWidgetExtension
      - target: CockpitWatch
    capabilities:
      Push Notifications: {}

  CockpitWidgetExtension:
    type: app-extension
    platform: iOS
    product: CockpitWidgetExtension
    sources:
      - CockpitApp/Widgets
      - path: CockpitWidgetExtension/CockpitWidgetExtension.entitlements
        buildPhase: none
    info:
      path: CockpitWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Cockpit Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: CockpitWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.ctmarsh.noahsark-cockpit.widgets
        CODE_SIGN_ENTITLEMENTS: CockpitWidgetExtension/CockpitWidgetExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: CockpitWidgetExtension/CockpitWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ctmarsh.cockpit

  CockpitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - CockpitWatch/Sources
      - path: CockpitWatch/Resources/Assets.xcassets
        buildPhase: resources
      - path: CockpitWatch/CockpitWatch.entitlements
        buildPhase: none
      - CockpitApp/Sources/Models
      - path: CockpitApp/Sources/Extensions/Color+Hex.swift
      - path: CockpitApp/Sources/Auth/KeychainHelper.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctmarsh.noahsark-cockpit.watchkitapp
        PRODUCT_NAME: Cockpit Watch
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_INDEPENDENT_WATCH_APP: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ctmarsh.noahsark-cockpit
        INFOPLIST_KEY_CFBundleDisplayName: Cockpit
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        CODE_SIGN_ENTITLEMENTS: CockpitWatch/CockpitWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
    entitlements:
      path: CockpitWatch/CockpitWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.ctmarsh.cockpit
