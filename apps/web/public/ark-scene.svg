<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Stormy sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="35%" stop-color="#141e28"/>
      <stop offset="55%" stop-color="#1a2636"/>
      <stop offset="70%" stop-color="#1e2d3a"/>
      <stop offset="100%" stop-color="#162028"/>
    </linearGradient>
    <!-- Golden horizon glow -->
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.4" fx="0.5" fy="0.62">
      <stop offset="0%" stop-color="#c49340" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#9a6a28" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#5a3d1a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a2636" stop-opacity="0"/>
    </radialGradient>
    <!-- Ocean gradient -->
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a22"/>
      <stop offset="40%" stop-color="#0a1218"/>
      <stop offset="100%" stop-color="#060c10"/>
    </linearGradient>
    <!-- Wood grain -->
    <linearGradient id="wood" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#5a3d20"/>
      <stop offset="30%" stop-color="#4a3018"/>
      <stop offset="60%" stop-color="#5e4225"/>
      <stop offset="100%" stop-color="#3d2810"/>
    </linearGradient>
    <!-- Lantern glow -->
    <radialGradient id="lantern1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c49340" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#9a7030" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c49340" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d4a24e" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a07828" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4a24e" stop-opacity="0"/>
    </radialGradient>
    <!-- Cloud filter -->
    <filter id="blur1">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <!-- Water reflection -->
    <filter id="waterReflect">
      <feGaussianBlur stdDeviation="3" in="SourceGraphic"/>
    </filter>
    <!-- Fog -->
    <filter id="fog">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- Horizon golden glow -->
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- Storm clouds - layered -->
  <g opacity="0.5">
    <ellipse cx="200" cy="80" rx="250" ry="70" fill="#141c24" filter="url(#blur1)"/>
    <ellipse cx="500" cy="50" rx="300" ry="80" fill="#101820" filter="url(#blur1)"/>
    <ellipse cx="800" cy="90" rx="280" ry="65" fill="#161e28" filter="url(#blur1)"/>
    <ellipse cx="1050" cy="60" rx="220" ry="75" fill="#121a22" filter="url(#blur1)"/>
  </g>

  <!-- Lower clouds with golden edge -->
  <g opacity="0.6">
    <ellipse cx="300" cy="180" rx="200" ry="40" fill="#1a2430" filter="url(#blur2)"/>
    <ellipse cx="600" cy="200" rx="250" ry="45" fill="#1e2838" filter="url(#blur2)"/>
    <ellipse cx="900" cy="170" rx="230" ry="50" fill="#1a2230" filter="url(#blur2)"/>
  </g>

  <!-- Cloud break - golden light streaks -->
  <g opacity="0.25">
    <polygon points="520,140 540,370 560,370" fill="#c49340" filter="url(#blur2)"/>
    <polygon points="580,120 610,370 640,370" fill="#b08030" filter="url(#blur2)"/>
    <polygon points="650,150 660,370 680,370" fill="#c49340" filter="url(#blur2)"/>
  </g>

  <!-- Rainbow - very subtle, behind clouds -->
  <g opacity="0.08">
    <path d="M 250 380 Q 600 100 950 380" fill="none" stroke="#e04040" stroke-width="12" filter="url(#blur2)"/>
    <path d="M 250 380 Q 600 110 950 380" fill="none" stroke="#e0a020" stroke-width="12" filter="url(#blur2)"/>
    <path d="M 250 380 Q 600 120 950 380" fill="none" stroke="#40a040" stroke-width="12" filter="url(#blur2)"/>
    <path d="M 250 380 Q 600 130 950 380" fill="none" stroke="#4060c0" stroke-width="12" filter="url(#blur2)"/>
  </g>

  <!-- Ocean base -->
  <rect y="360" width="1200" height="240" fill="url(#ocean)"/>

  <!-- Wave layers -->
  <g opacity="0.4">
    <path d="M 0 370 Q 100 360 200 370 Q 300 380 400 370 Q 500 360 600 370 Q 700 380 800 370 Q 900 360 1000 370 Q 1100 380 1200 370 V 600 H 0 Z" fill="#0d1820"/>
    <path d="M 0 385 Q 150 375 300 385 Q 450 395 600 385 Q 750 375 900 385 Q 1050 395 1200 385 V 600 H 0 Z" fill="#0a1418"/>
    <path d="M 0 400 Q 120 392 240 400 Q 360 408 480 400 Q 600 392 720 400 Q 840 408 960 400 Q 1080 392 1200 400 V 600 H 0 Z" fill="#081015"/>
  </g>

  <!-- Wave highlights -->
  <g opacity="0.15">
    <path d="M 0 372 Q 100 365 200 372 Q 300 379 400 372 Q 500 365 600 372" fill="none" stroke="#c49340" stroke-width="1"/>
    <path d="M 300 388 Q 400 382 500 388 Q 600 394 700 388 Q 800 382 900 388" fill="none" stroke="#8a6a30" stroke-width="1"/>
  </g>

  <!-- THE ARK -->
  <g transform="translate(380, 280)">
    <!-- Hull shadow -->
    <ellipse cx="220" cy="105" rx="200" ry="25" fill="#060a0e" opacity="0.5" filter="url(#blur2)"/>

    <!-- Hull - main body -->
    <path d="M 40 60 L 60 100 L 380 100 L 400 60 Q 390 20 340 10 L 100 10 Q 50 20 40 60 Z" fill="url(#wood)" stroke="#3d2810" stroke-width="1.5"/>

    <!-- Hull planks -->
    <line x1="55" y1="40" x2="385" y2="40" stroke="#3d2810" stroke-width="0.8" opacity="0.6"/>
    <line x1="50" y1="55" x2="390" y2="55" stroke="#3d2810" stroke-width="0.8" opacity="0.6"/>
    <line x1="47" y1="70" x2="393" y2="70" stroke="#3d2810" stroke-width="0.8" opacity="0.6"/>
    <line x1="55" y1="85" x2="385" y2="85" stroke="#3d2810" stroke-width="0.8" opacity="0.6"/>

    <!-- Keel -->
    <path d="M 60 100 Q 220 115 380 100" fill="none" stroke="#2a1a08" stroke-width="3"/>

    <!-- Deck -->
    <rect x="80" y="5" width="280" height="8" rx="2" fill="#4a3520" stroke="#3d2810" stroke-width="0.5"/>

    <!-- Cabin/house structure -->
    <rect x="120" y="-40" width="200" height="45" rx="3" fill="#4a3218" stroke="#3d2810" stroke-width="1"/>
    <!-- Cabin planks -->
    <line x1="120" y1="-25" x2="320" y2="-25" stroke="#3d2810" stroke-width="0.6" opacity="0.5"/>
    <line x1="120" y1="-10" x2="320" y2="-10" stroke="#3d2810" stroke-width="0.6" opacity="0.5"/>

    <!-- Upper cabin -->
    <rect x="160" y="-70" width="120" height="32" rx="2" fill="#443018" stroke="#3d2810" stroke-width="1"/>

    <!-- Roof -->
    <path d="M 150 -70 L 220 -90 L 290 -70" fill="#3d2810" stroke="#2a1a08" stroke-width="1"/>

    <!-- Windows with lantern glow -->
    <rect x="140" y="-35" width="14" height="18" rx="2" fill="#c49340" opacity="0.9"/>
    <rect x="165" y="-35" width="14" height="18" rx="2" fill="#b08030" opacity="0.7"/>
    <rect x="190" y="-35" width="14" height="18" rx="2" fill="#c49340" opacity="0.9"/>
    <rect x="260" y="-35" width="14" height="18" rx="2" fill="#c49340" opacity="0.8"/>
    <rect x="285" y="-35" width="14" height="18" rx="2" fill="#b08030" opacity="0.7"/>
    <rect x="305" y="-35" width="14" height="18" rx="2" fill="#c49340" opacity="0.6"/>

    <!-- Upper windows -->
    <rect x="180" y="-63" width="10" height="14" rx="1.5" fill="#d4a24e" opacity="0.9"/>
    <rect x="200" y="-63" width="10" height="14" rx="1.5" fill="#c49340" opacity="0.8"/>
    <rect x="220" y="-63" width="10" height="14" rx="1.5" fill="#d4a24e" opacity="0.9"/>
    <rect x="240" y="-63" width="10" height="14" rx="1.5" fill="#c49340" opacity="0.7"/>
    <rect x="260" y="-63" width="10" height="14" rx="1.5" fill="#d4a24e" opacity="0.6"/>

    <!-- Window glow halos -->
    <circle cx="147" cy="-26" r="20" fill="url(#lantern1)" opacity="0.5"/>
    <circle cx="197" cy="-26" r="20" fill="url(#lantern1)" opacity="0.5"/>
    <circle cx="267" cy="-26" r="18" fill="url(#lantern1)" opacity="0.4"/>
    <circle cx="225" cy="-56" r="25" fill="url(#lantern2)" opacity="0.3"/>

    <!-- Bow detail -->
    <path d="M 40 60 L 20 45 L 40 30" fill="none" stroke="#5a3d20" stroke-width="2" stroke-linecap="round"/>

    <!-- Stern detail -->
    <path d="M 400 60 L 415 50 Q 420 35 410 25" fill="none" stroke="#5a3d20" stroke-width="2" stroke-linecap="round"/>

    <!-- Mast -->
    <line x1="220" y1="-90" x2="220" y2="-150" stroke="#3d2810" stroke-width="3"/>
    <line x1="220" y1="-140" x2="280" y2="-140" stroke="#3d2810" stroke-width="1.5"/>
  </g>

  <!-- Water reflection of ark -->
  <g opacity="0.15" transform="translate(380, 390) scale(1, 0.3)" filter="url(#waterReflect)">
    <path d="M 40 60 L 60 100 L 380 100 L 400 60 Q 390 20 340 10 L 100 10 Q 50 20 40 60 Z" fill="#c49340"/>
  </g>

  <!-- Golden reflection on water -->
  <g opacity="0.12">
    <path d="M 540 380 L 560 600 L 680 600 L 660 380" fill="#c49340" filter="url(#blur2)"/>
  </g>

  <!-- Dove -->
  <g transform="translate(680, 160)" opacity="0.9">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="#d5cfc2" transform="rotate(-15)"/>
    <!-- Left wing up -->
    <path d="M -4 -2 Q -20 -25 -8 -30 Q 0 -28 4 -8" fill="#d5cfc2" opacity="0.9"/>
    <!-- Right wing up -->
    <path d="M 4 -2 Q 20 -28 30 -25 Q 25 -18 8 -4" fill="#c8c0b0" opacity="0.85"/>
    <!-- Head -->
    <circle cx="12" cy="-4" r="4" fill="#d5cfc2"/>
    <!-- Beak -->
    <path d="M 16 -4 L 20 -3 L 16 -2" fill="#8a7050"/>
    <!-- Eye -->
    <circle cx="13.5" cy="-5" r="1" fill="#2a2010"/>
    <!-- Tail -->
    <path d="M -10 2 L -22 8 L -18 0 Z" fill="#c8c0b0"/>
    <!-- Olive branch -->
    <g transform="translate(17, 0)">
      <line x1="0" y1="0" x2="12" y2="8" stroke="#5a7a3a" stroke-width="1"/>
      <ellipse cx="6" cy="3" rx="3" ry="1.5" fill="#5a9a5c" transform="rotate(-20, 6, 3)"/>
      <ellipse cx="9" cy="5" rx="2.5" ry="1.2" fill="#4a8a4a" transform="rotate(-10, 9, 5)"/>
      <ellipse cx="12" cy="8" rx="2" ry="1" fill="#5a9a5c" transform="rotate(-30, 12, 8)"/>
    </g>
  </g>

  <!-- Atmospheric fog layers -->
  <g opacity="0.06">
    <rect y="340" width="1200" height="60" fill="#8a9aa0" filter="url(#fog)"/>
  </g>
  <g opacity="0.04">
    <rect y="280" width="1200" height="40" fill="#6a7a80" filter="url(#fog)"/>
  </g>

  <!-- Stars (visible through cloud breaks) -->
  <g opacity="0.3">
    <circle cx="100" cy="30" r="1" fill="#d5cfc2"/>
    <circle cx="250" cy="60" r="0.8" fill="#d5cfc2"/>
    <circle cx="450" cy="25" r="1.2" fill="#d5cfc2"/>
    <circle cx="750" cy="45" r="0.8" fill="#d5cfc2"/>
    <circle cx="950" cy="20" r="1" fill="#d5cfc2"/>
    <circle cx="1100" cy="55" r="0.7" fill="#d5cfc2"/>
    <circle cx="150" cy="110" r="0.6" fill="#d5cfc2"/>
    <circle cx="850" cy="80" r="0.9" fill="#d5cfc2"/>
    <circle cx="1050" cy="100" r="0.7" fill="#d5cfc2"/>
  </g>
</svg>
