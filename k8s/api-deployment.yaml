apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit-api
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-api
    app.kubernetes.io/part-of: cockpit
spec:
  replicas: 1
  # Recreate strategy — PVC is ReadWriteOnce, can't attach to two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-api
    spec:
      serviceAccountName: cockpit-api
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: api
          image: gitlab.noahsark.me:5050/ctmarsh/cockpit/api:latest
          ports:
            - containerPort: 4000
          env:
            - name: API_PORT
              value: "4000"
          envFrom:
            - secretRef:
                name: cockpit-secrets
          volumeMounts:
            - name: cockpit-data
              mountPath: /app/data
          # Startup probe — gives the app up to 5 minutes to start
          # (Bun JIT compiles all TS modules on first run, ~90s+ and ~4Gi RAM)
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            # No memory limit — Bun startup is memory-intensive
      volumes:
        - name: cockpit-data
          persistentVolumeClaim:
            claimName: cockpit-data
