apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit-api
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-api
    app.kubernetes.io/part-of: cockpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-api
    spec:
      # hostPID lets the container see host processes (for sysmon)
      hostPID: true
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: api
          image: gitlab.noahsark.me:5050/ctmarsh/cockpit/api:latest
          ports:
            - containerPort: 4000
          env:
            - name: API_PORT
              value: "4000"
            - name: PROC_ROOT
              value: "/host/proc"
          envFrom:
            - secretRef:
                name: cockpit-secrets
          volumeMounts:
            - name: cockpit-data
              mountPath: /app/data
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: cockpit-data
          persistentVolumeClaim:
            claimName: cockpit-data
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
