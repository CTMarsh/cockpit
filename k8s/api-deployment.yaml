apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit-api
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-api
    app.kubernetes.io/part-of: cockpit
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-api
    spec:
      serviceAccountName: cockpit-api
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: api
          image: gitlab.noahsark.me:5050/ctmarsh/cockpit/api:latest
          ports:
            - containerPort: 4000
          env:
            - name: API_PORT
              value: "4000"
            # CloudNativePG auto-generates cockpit-pg-app secret with full URI
            # pointing to the cockpit-pg-rw (read-write) service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cockpit-pg-app
                  key: uri
            - name: REDIS_URL
              value: "redis://cockpit-redis:6379"
          envFrom:
            - secretRef:
                name: cockpit-secrets
          # Startup probe — gives the app up to 5 minutes to start
          # (Bun JIT compiles all TS modules on first run, ~90s+ and ~4Gi RAM)
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            # No memory limit — Bun startup is memory-intensive
