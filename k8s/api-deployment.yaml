apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit-api
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-api
    app.kubernetes.io/part-of: cockpit
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-api
    spec:
      serviceAccountName: cockpit-api
      imagePullSecrets:
        - name: gitlab-registry
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cockpit-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: gitlab.noahsark.me:5050/ctmarsh/cockpit/api:latest
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4000
          env:
            - name: API_PORT
              value: "4000"
            # DATABASE_URL provided by envFrom: cockpit-secrets
            # Redis Sentinel — ioredis auto-discovers master via sentinels
            - name: REDIS_SENTINEL_HOSTS
              value: "cockpit-redis-0.cockpit-redis.cockpit.svc.cluster.local:26379,cockpit-redis-1.cockpit-redis.cockpit.svc.cluster.local:26379,cockpit-redis-2.cockpit-redis.cockpit.svc.cluster.local:26379"
            - name: REDIS_SENTINEL_MASTER
              value: "cockpit-master"
          envFrom:
            - secretRef:
                name: cockpit-secrets
          # Startup probe — gives the app up to 5 minutes to start
          # (Bun JIT compiles all TS modules on first run, ~90s+ and ~4Gi RAM)
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              cpu: "2"
              memory: "8Gi"  # Bun JIT needs ~4Gi at startup — explicit to prevent LimitRange 512Mi default
