apiVersion: v1
kind: ServiceAccount
metadata:
  name: cockpit-api
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-api
    app.kubernetes.io/part-of: cockpit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cockpit-manager
  labels:
    app.kubernetes.io/part-of: cockpit
rules:
  # Core API — pods, namespaces, events, nodes, services
  - apiGroups: [""]
    resources: ["pods", "namespaces", "events", "nodes", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Pod logs: view container logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Apps — deployments, statefulsets, daemonsets, replicasets
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  # Deployment scale: scale replicas up/down
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
  # cert-manager CRDs — certificate monitoring
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "clusterissuers", "issuers", "certificaterequests"]
    verbs: ["get", "list", "watch"]
  # Traefik CRDs — route and middleware monitoring
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares", "tlsstores", "traefikservices"]
    verbs: ["get", "list", "watch"]
  # Metrics API — node and pod resource metrics
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cockpit-manager
  labels:
    app.kubernetes.io/part-of: cockpit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cockpit-manager
subjects:
  - kind: ServiceAccount
    name: cockpit-api
    namespace: cockpit
