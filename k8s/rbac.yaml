apiVersion: v1
kind: ServiceAccount
metadata:
  name: cockpit-api
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-api
    app.kubernetes.io/part-of: cockpit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cockpit-pod-reader
  labels:
    app.kubernetes.io/part-of: cockpit
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cockpit-pod-reader
  labels:
    app.kubernetes.io/part-of: cockpit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cockpit-pod-reader
subjects:
  - kind: ServiceAccount
    name: cockpit-api
    namespace: cockpit
