# ORPHANED: cockpit-data PVC is not mounted by any deployment.
# Pre-CNPG leftover — was used for SQLite before PostgreSQL migration.
# Verify: kubectl get pods -n cockpit -o json | jq '.items[].spec.volumes[].persistentVolumeClaim.claimName'
# Safe to delete this file + remove from kustomization.yaml after verification.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cockpit-data
  namespace: cockpit
  labels:
    app.kubernetes.io/part-of: cockpit
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
