## Create the runner token secret before Helm install/upgrade:
## kubectl create secret generic gitlab-runner-token \
##   --namespace gitlab-runner \
##   --from-literal=runner-registration-token="" \
##   --from-literal=runner-token="<your-token-here>"

## GitLab Runner Helm chart values for k3s-noahsark
gitlabUrl: https://gitlab.noahsark.me

## Runner configuration
runners:
  secret: gitlab-runner-token
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "alpine:latest"
        privileged = false
        cpu_request = "200m"
        memory_request = "256Mi"
        cpu_limit = "2"
        memory_limit = "4Gi"
        service_cpu_request = "100m"
        service_memory_request = "128Mi"
      [runners.kubernetes.pod_labels]
        "gitlab-runner" = "k3s"
      [runners.cache]
        Type = "s3"
        Shared = true
        [runners.cache.s3]
          ServerAddress = "rustfs.minio.svc:9000"
          BucketName = "gitlab-runner-cache"
          BucketLocation = "us-east-1"
          Insecure = true
          AuthenticationType = "access-key"
  cache:
    secretName: rustfs-cache-credentials

## Concurrent jobs — matches worker count
concurrent: 6

## Runner pod resources
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

## S3 cache via RustFS
cache:
  cacheType: s3
  cachePath: "gitlab-runner"
  cacheShared: true
  s3ServerAddress: rustfs.minio.svc:9000
  s3BucketName: gitlab-runner-cache
  s3BucketLocation: us-east-1
  s3CacheInsecure: true
  secretName: rustfs-cache-credentials

## RBAC
rbac:
  create: true
