# Redis HA with Sentinel — 3 Redis nodes + 3 Sentinel sidecars
# Prerequisites:
#   1. Remove existing cockpit-redis deployment first
#   2. Apply this manifest: kubectl apply -f k8s/redis-sentinel.yaml
#   3. Update API deployment REDIS_SENTINEL_* env vars
#
# Architecture:
#   - 3 Redis pods (1 master elected, 2 replicas)
#   - Sentinel sidecar on each pod monitors health
#   - Automatic failover if master dies (<10s)
#   - ioredis Sentinel-aware client reconnects transparently
#
# Services:
#   cockpit-redis-sentinel — Sentinel discovery (port 26379)
#   cockpit-redis          — Headless service for StatefulSet (port 6379)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-redis
    app.kubernetes.io/part-of: cockpit
data:
  redis.conf: |
    maxmemory 128mb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10

  init-redis.sh: |
    #!/bin/sh
    set -e

    # Copy config to writable location
    cp /etc/redis/redis.conf /data/redis.conf

    HOSTNAME=$(hostname)
    INDEX=${HOSTNAME##*-}

    # Replicas connect to pod-0 (initial master)
    if [ "$INDEX" != "0" ]; then
      echo "replicaof cockpit-redis-0.cockpit-redis.cockpit.svc.cluster.local 6379" >> /data/redis.conf
    fi

    exec redis-server /data/redis.conf

  init-sentinel.sh: |
    #!/bin/sh
    set -e

    # Wait for Redis to be ready
    until redis-cli -h localhost -p 6379 ping 2>/dev/null | grep -q PONG; do
      echo "Waiting for Redis..."
      sleep 1
    done

    # Resolve master IP (sentinel needs resolvable address at config parse time)
    MASTER_HOST="cockpit-redis-0.cockpit-redis.cockpit.svc.cluster.local"
    echo "Waiting for master DNS to resolve..."
    until MASTER_IP=$(getent hosts "$MASTER_HOST" | awk '{print $1}' | head -1) && [ -n "$MASTER_IP" ]; do
      echo "Waiting for DNS: $MASTER_HOST"
      sleep 2
    done
    echo "Resolved master: $MASTER_HOST -> $MASTER_IP"

    # Generate sentinel config with resolved IP
    cat > /data/sentinel.conf <<SEOF
    sentinel monitor cockpit-master $MASTER_IP 6379 2
    sentinel down-after-milliseconds cockpit-master 5000
    sentinel failover-timeout cockpit-master 10000
    sentinel parallel-syncs cockpit-master 1
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    SEOF

    exec redis-sentinel /data/sentinel.conf
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockpit-redis
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-redis
    app.kubernetes.io/part-of: cockpit
spec:
  serviceName: cockpit-redis
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-redis
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cockpit-redis
                topologyKey: kubernetes.io/hostname
      containers:
        # Redis server
        - name: redis
          image: redis:7-alpine
          command: ["/bin/sh", "/etc/redis/init-redis.sh"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"

        # Sentinel sidecar
        - name: sentinel
          image: redis:7-alpine
          command: ["/bin/sh", "/etc/redis/init-sentinel.sh"]
          ports:
            - containerPort: 26379
              name: sentinel
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: sentinel-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"

      volumes:
        - name: redis-config
          configMap:
            name: redis-config
            defaultMode: 0755
        - name: redis-data
          emptyDir: {}
        - name: sentinel-data
          emptyDir: {}
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: cockpit-redis
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-redis
    app.kubernetes.io/part-of: cockpit
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cockpit-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
---
# Sentinel discovery service
apiVersion: v1
kind: Service
metadata:
  name: cockpit-redis-sentinel
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-redis
    app.kubernetes.io/part-of: cockpit
spec:
  selector:
    app.kubernetes.io/name: cockpit-redis
  ports:
    - port: 26379
      targetPort: 26379
      protocol: TCP
      name: sentinel
