# CloudNativePG Scheduled Backup — daily to MinIO
# Prerequisites:
#   1. Create MinIO bucket: mc mb minio/cockpit-pg-backups
#   2. Create S3 credentials secret:
#      kubectl create secret generic cockpit-pg-s3-creds -n cockpit \
#        --from-literal=ACCESS_KEY_ID=<minio-access-key> \
#        --from-literal=SECRET_ACCESS_KEY=<minio-secret-key>
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cockpit-pg-daily-backup
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-pg
    app.kubernetes.io/part-of: cockpit
spec:
  # Daily at 2 AM UTC
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: cockpit-pg
  immediate: false
  suspend: false
