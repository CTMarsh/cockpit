# RBAC for GitLab Runner — least-privilege per-namespace Roles
# The runner's ServiceAccount (system:serviceaccount:gitlab-runner:default)
# gets only the permissions it needs in each project namespace.
#
# Replaces the KUBECONFIG CI variable approach with proper RBAC.
---
# ── cockpit namespace — broad access (infrastructure apply) ──────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-deploy
  namespace: cockpit
  labels:
    app.kubernetes.io/part-of: gitlab-runner
rules:
  # Core workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pods (for rollout status checks)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Services, ConfigMaps, Secrets, PVCs
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CNPG CRDs
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Barman object store (CNPG backups)
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-deploy
  namespace: cockpit
  labels:
    app.kubernetes.io/part-of: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-deploy
subjects:
  - kind: ServiceAccount
    name: default
    namespace: gitlab-runner
---
# ── notify namespace — minimal (deploy only) ─────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-deploy
  namespace: notify
  labels:
    app.kubernetes.io/part-of: gitlab-runner
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-deploy
  namespace: notify
  labels:
    app.kubernetes.io/part-of: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-deploy
subjects:
  - kind: ServiceAccount
    name: default
    namespace: gitlab-runner
---
# ── chat-app namespace — minimal (deploy only) ──────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-deploy
  namespace: chat-app
  labels:
    app.kubernetes.io/part-of: gitlab-runner
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-deploy
  namespace: chat-app
  labels:
    app.kubernetes.io/part-of: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-deploy
subjects:
  - kind: ServiceAccount
    name: default
    namespace: gitlab-runner
