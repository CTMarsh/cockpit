apiVersion: v1
kind: ConfigMap
metadata:
  name: cockpit-nginx-config
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-web
    app.kubernetes.io/part-of: cockpit
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # API proxy — uses Kubernetes service name
        location /api/ {
            proxy_pass http://cockpit-api:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
