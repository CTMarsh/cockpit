apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit-web
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-web
    app.kubernetes.io/part-of: cockpit
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-web
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: web
          image: gitlab.noahsark.me:5050/ctmarsh/cockpit/web:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
