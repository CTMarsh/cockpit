apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockpit-postgres
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-postgres
    app.kubernetes.io/part-of: cockpit
spec:
  serviceName: cockpit-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: cockpit-postgres-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cockpit
                - -d
                - cockpit
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cockpit
                - -d
                - cockpit
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cockpit
                - -d
                - cockpit
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: cockpit-postgres
          app.kubernetes.io/part-of: cockpit
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-1r
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cockpit-postgres
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-postgres
    app.kubernetes.io/part-of: cockpit
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cockpit-postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
