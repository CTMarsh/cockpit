apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cockpit-tls
  namespace: cockpit
spec:
  secretName: cockpit-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - dashboard.noahsark.me
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cockpit
  namespace: cockpit
  labels:
    app.kubernetes.io/part-of: cockpit
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`dashboard.noahsark.me`) && PathPrefix(`/api`)
      services:
        - name: cockpit-api
          port: 4000
    - kind: Rule
      match: Host(`dashboard.noahsark.me`)
      services:
        - name: cockpit-web
          port: 80
  tls:
    secretName: cockpit-tls
