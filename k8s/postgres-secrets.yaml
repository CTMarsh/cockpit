# IMPORTANT: Change password before deploying to production!
# Generate a secure password: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: cockpit-postgres-secrets
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-postgres
    app.kubernetes.io/part-of: cockpit
type: Opaque
stringData:
  POSTGRES_DB: cockpit
  POSTGRES_USER: cockpit
  POSTGRES_PASSWORD: changeme-in-production
  # Connection string for API pods
  DATABASE_URL: postgresql://cockpit:changeme-in-production@cockpit-postgres:5432/cockpit
