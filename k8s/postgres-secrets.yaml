# Secret is pre-created on the cluster with a secure password via kubectl.
# This manifest exists for reference only — DO NOT commit real credentials.
# To recreate: kubectl create secret generic cockpit-postgres-secrets -n cockpit \
#   --from-literal=POSTGRES_DB=cockpit --from-literal=POSTGRES_USER=cockpit \
#   --from-literal=POSTGRES_PASSWORD='<secure>' \
#   --from-literal=DATABASE_URL='postgresql://cockpit:<secure>@cockpit-postgres:5432/cockpit'
apiVersion: v1
kind: Secret
metadata:
  name: cockpit-postgres-secrets
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-postgres
    app.kubernetes.io/part-of: cockpit
type: Opaque
stringData:
  POSTGRES_DB: cockpit
  POSTGRES_USER: cockpit
  POSTGRES_PASSWORD: CHANGE_ME_ON_CLUSTER
  DATABASE_URL: postgresql://cockpit:CHANGE_ME_ON_CLUSTER@cockpit-postgres:5432/cockpit
