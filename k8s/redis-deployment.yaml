apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit-redis
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-redis
    app.kubernetes.io/part-of: cockpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cockpit-redis
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-redis
    app.kubernetes.io/part-of: cockpit
spec:
  selector:
    app.kubernetes.io/name: cockpit-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
