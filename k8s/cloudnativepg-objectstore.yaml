# CloudNativePG ObjectStore — Barman Cloud Plugin backup target
# Replaces deprecated spec.backup.barmanObjectStore in the Cluster resource.
# The barman-cloud plugin must be installed first:
#   kubectl apply -f https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.11.0/manifest.yaml
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cockpit-pg-backups
  namespace: cockpit
  labels:
    app.kubernetes.io/name: cockpit-pg
    app.kubernetes.io/part-of: cockpit
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://cockpit-pg-backups/
    endpointURL: http://rustfs.minio.svc:9000
    s3Credentials:
      accessKeyId:
        name: cockpit-pg-s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cockpit-pg-s3-creds
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
